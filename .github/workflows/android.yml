name: Android Build

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Java 17
      # ---------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ---------------------------------------------------------
      # Gradle
      # ---------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ---------------------------------------------------------
      # Make Gradle Wrapper executable
      # ---------------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ---------------------------------------------------------
      # Show build environment
      # ---------------------------------------------------------
      - name: Show environment
        run: |
          java -version
          ./gradlew --version

      # ---------------------------------------------------------
      # Validate Gradle wrapper
      # ---------------------------------------------------------
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # ---------------------------------------------------------
      # Build Debug APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        run: |
          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # ---------------------------------------------------------
      # Build Release APK
      #
      # Ini menghasilkan release APK unsigned jika project
      # belum dikonfigurasi signing.
      # ---------------------------------------------------------
      - name: Build Release APK
        run: |
          ./gradlew \
            :app:assembleRelease \
            --stacktrace \
            --no-daemon

      # ---------------------------------------------------------
      # List generated APK
      # ---------------------------------------------------------
      - name: List APK files
        if: always()
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print || true

      # ---------------------------------------------------------
      # Upload Debug APK
      # ---------------------------------------------------------
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NontonTV-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # ---------------------------------------------------------
      # Upload Release APK
      # ---------------------------------------------------------
      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NontonTV-release-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
