name: Android Build

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NontonTV
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout source
        uses: actions/checkout@v5


      # =========================================================
      # JAVA 17
      # =========================================================

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # =========================================================
      # SETUP GRADLE
      # =========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: false


      # =========================================================
      # CHECK PROJECT
      # =========================================================

      - name: Check project files
        shell: bash
        run: |
          echo "======================================"
          echo "PROJECT DIRECTORY"
          echo "======================================"

          pwd

          echo
          echo "Files:"
          find . -maxdepth 2 -type f | sort | head -200

          echo
          echo "Gradle wrapper:"
          ls -la gradlew || true
          ls -la gradle/wrapper || true


      # =========================================================
      # FIX GRADLE WRAPPER LINE ENDINGS
      # =========================================================

      - name: Fix Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew tidak ditemukan."
            exit 1
          fi

          # Hilangkan CRLF jika file gradlew menggunakan Windows
          # line endings.
          sed -i 's/\r$//' ./gradlew

          chmod +x ./gradlew

          echo
          echo "gradlew permissions:"
          ls -l ./gradlew

          echo
          echo "gradlew first lines:"
          head -30 ./gradlew


      # =========================================================
      # VERIFY WRAPPER JAR
      # =========================================================

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR:"
            echo "gradle/wrapper/gradle-wrapper.jar tidak ditemukan."
            echo
            echo "Isi folder gradle/wrapper:"
            ls -la gradle/wrapper || true
            exit 1
          fi

          echo "Gradle wrapper JAR ditemukan:"
          ls -lh gradle/wrapper/gradle-wrapper.jar


      # =========================================================
      # JAVA / GRADLE VERSION
      # =========================================================

      - name: Show build environment
        shell: bash
        run: |
          java -version

          echo
          echo "JAVA_HOME=$JAVA_HOME"

          echo
          ./gradlew --version


      # =========================================================
      # CLEAN
      # =========================================================

      - name: Clean project
        shell: bash
        run: |
          ./gradlew clean \
            --stacktrace \
            --no-daemon


      # =========================================================
      # BUILD DEBUG
      # =========================================================

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all


      # =========================================================
      # BUILD RELEASE
      # =========================================================

      - name: Build Release APK
        shell: bash
        run: |
          ./gradlew :app:assembleRelease \
            --stacktrace \
            --no-daemon \
            --warning-mode all


      # =========================================================
      # SHOW APK
      # =========================================================

      - name: List generated APK
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "GENERATED APK"
          echo "======================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true


      # =========================================================
      # UPLOAD DEBUG APK
      # =========================================================

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NontonTV-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14


      # =========================================================
      # UPLOAD RELEASE APK
      # =========================================================

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NontonTV-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
